<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>志愿参考</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Design Tokens ── */
:root {
  /* iOS Light Color System */
  --bg-base: #F2F3F8;
  --bg-gradient: radial-gradient(ellipse at top, #FFFFFF 0%, #F2F3F8 50%, #EBEEF7 100%);
  --bg-noise: radial-gradient(circle at 20% 0%, rgba(99,102,241,.04) 0%, transparent 50%),
              radial-gradient(circle at 80% 100%, rgba(168,85,247,.04) 0%, transparent 50%);

  /* Glass surfaces (iOS 17 Frosted Glass) */
  --glass-primary: rgba(255,255,255,.72);
  --glass-secondary: rgba(255,255,255,.55);
  --glass-tertiary: rgba(255,255,255,.4);
  --glass-border: rgba(255,255,255,.8);
  --glass-shadow: 0 1px 3px rgba(60,72,120,.04), 0 8px 24px rgba(60,72,120,.06);
  --glass-shadow-lg: 0 4px 12px rgba(60,72,120,.05), 0 20px 60px rgba(60,72,120,.1);
  --glass-blur: blur(24px) saturate(180%);

  /* iOS Typography */
  --text-primary: #1D1D1F;
  --text-secondary: #6E6E73;
  --text-tertiary: #A1A1A6;
  --text-quaternary: #C7C7CC;

  /* iOS System Colors */
  --system-blue: #007AFF;
  --system-blue-light: rgba(0,122,255,.1);
  --system-indigo: #5856D6;
  --system-purple: #AF52DE;
  --system-pink: #FF2D55;
  --system-red: #FF3B30;
  --system-orange: #FF9500;
  --system-yellow: #FFCC00;
  --system-green: #34C759;
  --system-teal: #30B0C7;
  --system-cyan: #32ADE6;

  /* Semantic tier colors */
  --tier-chong: #FF3B30;
  --tier-chongwen: #FF9500;
  --tier-wen: #34C759;
  --tier-bao: #007AFF;

  /* Radii (iOS 17 SF Symbols) */
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
  --r-2xl: 36px;

  /* Spacing */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  /* Font */
  --font: -apple-system, 'SF Pro Display', 'Noto Sans SC', 'Inter', system-ui, sans-serif;
  --font-mono: 'SF Mono', ui-monospace, monospace;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: 17px;
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font);
  background: var(--bg-gradient);
  color: var(--text-primary);
  line-height: 1.45;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  font-feature-settings: 'ss01', 'tnum';
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: var(--bg-noise);
  pointer-events: none;
  z-index: 0;
}

/* ── Layout ── */
.app {
  position: relative;
  z-index: 1;
  max-width: 1080px;
  margin: 0 auto;
  padding: env(safe-area-inset-top) 20px calc(env(safe-area-inset-bottom) + 40px);
}

/* ── Header (iOS Large Title) ── */
.header {
  padding: 16px 0 8px;
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(242,243,248,.7);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 0.5px solid rgba(60,72,120,.06);
  margin-left: -20px;
  margin-right: -20px;
  padding-left: 20px;
  padding-right: 20px;
}

.header-large-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 4px;
}
.header-large-title .title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, #1D1D1F 0%, #4A4A50 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-large-title .subtitle {
  font-size: 15px;
  color: var(--text-tertiary);
  font-weight: 500;
}
.header-meta {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.meta-chip {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 12px;
  background: rgba(255,255,255,.6);
  color: var(--text-secondary);
  backdrop-filter: blur(8px);
  border: 0.5px solid rgba(255,255,255,.6);
  font-weight: 500;
  letter-spacing: 0;
}

/* ── Hero Card ── */
.hero {
  margin-top: 16px;
}

.score-card {
  background: var(--glass-primary);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 0.5px solid var(--glass-border);
  border-radius: var(--r-xl);
  padding: 22px 24px;
  box-shadow: var(--glass-shadow);
  position: relative;
  overflow: hidden;
}

.score-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
}

.score-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
}
.score-main {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.score-num {
  font-size: 56px;
  font-weight: 800;
  letter-spacing: -0.04em;
  font-feature-settings: 'tnum';
  background: linear-gradient(135deg, #5856D6 0%, #AF52DE 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1;
}
.score-label {
  font-size: 17px;
  color: var(--text-tertiary);
  font-weight: 500;
}
.score-info {
  text-align: right;
}
.score-info .rank {
  font-size: 13px;
  color: var(--text-tertiary);
}
.score-info .rank-val {
  font-size: 17px;
  font-weight: 600;
  color: var(--text-secondary);
  font-feature-settings: 'tnum';
}

/* Probability overview bar */
.prob-overview {
  margin-top: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.prob-overview .label {
  font-size: 13px;
  color: var(--text-tertiary);
  flex-shrink: 0;
}
.prob-overview .bar {
  flex: 1;
  height: 6px;
  background: rgba(120,130,180,.1);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.prob-overview .bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #FF3B30 0%, #FF9500 30%, #34C759 60%, #007AFF 100%);
  border-radius: 3px;
  transition: width .6s cubic-bezier(.34,1.56,.64,1);
}
.prob-overview .num {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  font-feature-settings: 'tnum';
  min-width: 56px;
  text-align: right;
}

/* Tier mini stats */
.tier-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 14px;
}
.tier-stat {
  background: var(--glass-secondary);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border: 0.5px solid rgba(255,255,255,.5);
  border-radius: var(--r-md);
  padding: 12px 8px;
  text-align: center;
  transition: transform .2s;
}
.tier-stat:active { transform: scale(.96); }
.tier-stat .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin: 0 auto 4px;
}
.tier-stat .n {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  font-feature-settings: 'tnum';
  line-height: 1.1;
}
.tier-stat .l {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 2px;
  letter-spacing: 0;
}

/* ── Controls ── */
.controls {
  margin-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.control-row {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 2px;
}
.control-row::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 16px;
  background: var(--glass-secondary);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border: 0.5px solid rgba(255,255,255,.6);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s cubic-bezier(.4,0,.2,1);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  letter-spacing: 0;
}
.chip:hover { background: var(--glass-primary); color: var(--text-primary); }
.chip:active { transform: scale(.94); }
.chip.active {
  background: var(--text-primary);
  color: #fff;
  border-color: var(--text-primary);
  box-shadow: 0 2px 8px rgba(29,29,31,.15);
}
.chip.chong.active { background: var(--tier-chong); border-color: var(--tier-chong); }
.chip.chongwen.active { background: var(--tier-chongwen); border-color: var(--tier-chongwen); }
.chip.wen.active { background: var(--tier-wen); border-color: var(--tier-wen); }
.chip.bao.active { background: var(--tier-bao); border-color: var(--tier-bao); }
.chip.sd.active { background: var(--system-orange); border-color: var(--system-orange); }
.chip.prob-high.active { background: var(--system-green); border-color: var(--system-green); }
.chip.prob-mid.active { background: var(--system-orange); border-color: var(--system-orange); }
.chip.prob-low.active { background: var(--system-red); border-color: var(--system-red); }

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
}
.search-input {
  width: 100%;
  padding: 8px 14px 8px 34px;
  border-radius: 14px;
  border: 0.5px solid rgba(255,255,255,.6);
  background: var(--glass-secondary);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  font-size: 14px;
  font-family: inherit;
  color: var(--text-primary);
  outline: none;
  transition: all .2s;
}
.search-input::placeholder { color: var(--text-tertiary); }
.search-input:focus {
  background: var(--glass-primary);
  border-color: var(--system-blue);
  box-shadow: 0 0 0 3px rgba(0,122,255,.1);
}
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  color: var(--text-tertiary);
  pointer-events: none;
}

.count-text {
  font-size: 13px;
  color: var(--text-tertiary);
  padding: 0 4px;
  font-feature-settings: 'tnum';
  white-space: nowrap;
}

/* ── Section ── */
.section { margin-top: 24px; }
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6px 10px;
}
.section-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-title .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.section-sub {
  font-size: 13px;
  color: var(--text-tertiary);
}

/* ── Card ── */
.card {
  background: var(--glass-primary);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 0.5px solid var(--glass-border);
  border-radius: var(--r-lg);
  margin-bottom: 8px;
  box-shadow: var(--glass-shadow);
  overflow: hidden;
  transition: all .25s cubic-bezier(.4,0,.2,1);
  cursor: pointer;
}
.card:hover {
  box-shadow: var(--glass-shadow-lg);
  transform: translateY(-1px);
}
.card:active {
  transform: scale(.99);
}

.card-row {
  display: grid;
  grid-template-columns: 32px auto 1fr auto;
  gap: 12px;
  padding: 14px 18px;
  align-items: center;
}

.card-idx {
  font-size: 13px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  font-weight: 500;
  text-align: center;
  font-feature-settings: 'tnum';
}

.card-tier {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.card-tier .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  box-shadow: 0 0 8px currentColor;
}
.card-tier .label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0;
}

.card-main {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.card-school {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}
.card-school .sd {
  font-size: 9px;
  background: var(--system-orange);
  color: #fff;
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.5;
}
.card-school .code {
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  font-weight: 500;
  letter-spacing: 0;
}
.card-major {
  font-size: 13px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 6px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.card-major .mcode {
  font-size: 10px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  background: rgba(120,130,180,.08);
  padding: 1px 5px;
  border-radius: 4px;
  flex-shrink: 0;
  letter-spacing: 0;
}
.card-major .mname {
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-stats {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}
.stat-block {
  text-align: right;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.stat-block .v {
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-mono);
  font-feature-settings: 'tnum';
  letter-spacing: 0;
  line-height: 1.1;
}
.stat-block .l {
  font-size: 10px;
  color: var(--text-tertiary);
  letter-spacing: 0;
}

.prob-block {
  text-align: center;
  min-width: 56px;
}
.prob-block .pct {
  font-size: 16px;
  font-weight: 700;
  font-family: var(--font-mono);
  font-feature-settings: 'tnum';
  letter-spacing: -0.01em;
  line-height: 1;
}
.prob-block .lbl {
  font-size: 10px;
  color: var(--text-tertiary);
  margin-top: 2px;
  letter-spacing: 0;
}
.prob-ring {
  width: 32px;
  height: 32px;
  margin: 0 auto;
  position: relative;
}

/* ── Detail ── */
.card-detail {
  max-height: 0;
  overflow: hidden;
  transition: max-height .35s cubic-bezier(.4,0,.2,1);
}
.card.expanded .card-detail {
  max-height: 280px;
}
.detail-inner {
  padding: 4px 18px 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 20px;
  border-top: 0.5px solid rgba(60,72,120,.08);
  margin-top: 2px;
}
.detail-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.detail-item .dl {
  font-size: 10px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 600;
}
.detail-item .dv {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.4;
}
.detail-item .dv.hl {
  color: var(--system-indigo);
  font-weight: 500;
}
.detail-item .dv.mono {
  font-family: var(--font-mono);
  letter-spacing: 0;
}
.detail-full { grid-column: 1 / -1; }

/* ── Empty ── */
.empty {
  text-align: center;
  padding: 60px 20px;
  display: none;
}
.empty.active { display: block; }
.empty .ic {
  font-size: 36px;
  margin-bottom: 8px;
  opacity: .5;
}
.empty .msg {
  font-size: 15px;
  color: var(--text-tertiary);
}

/* ── Footer ── */
.footer {
  margin-top: 32px;
  padding: 16px 8px;
  text-align: center;
  font-size: 12px;
  color: var(--text-quaternary);
  line-height: 1.5;
}

/* ── Responsive ── */
@media (max-width: 768px) {
  .app { padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 32px); }
  .header { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; }
  .header-large-title .title { font-size: 28px; }
  .score-num { font-size: 44px; }
  .tier-stats { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tier-stat { padding: 10px 6px; }
  .tier-stat .n { font-size: 18px; }
  .card-row {
    grid-template-columns: 24px auto 1fr auto;
    gap: 10px;
    padding: 12px 14px;
  }
  .card-school { font-size: 14px; }
  .card-school .code { display: none; }
  .card-major { font-size: 12px; }
  .card-stats { gap: 10px; }
  .stat-block .v { font-size: 12px; }
  .prob-block .pct { font-size: 14px; }
  .prob-block { min-width: 44px; }
  .detail-inner { grid-template-columns: 1fr; gap: 8px; padding: 4px 14px 14px; }
  .section-title { font-size: 19px; }
  .section-header { padding: 0 4px 8px; }
}

@media (max-width: 480px) {
  .header-large-title .title { font-size: 24px; }
  .header-large-title .subtitle { display: none; }
  .score-num { font-size: 38px; }
  .card-row { grid-template-columns: 20px 1fr auto; gap: 8px; padding: 10px 12px; }
  .card-tier .label { display: none; }
  .card-school .sd { font-size: 8px; }
  .card-school { font-size: 13px; }
  .card-major { font-size: 11px; }
  .card-stats { gap: 8px; }
  .stat-block { display: none; }
  .stat-block:last-of-type { display: flex; }
  .prob-block { min-width: 40px; }
  .prob-block .pct { font-size: 13px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="header-large-title">
      <span class="title">志愿参考</span>
      <span class="subtitle">450分 · 历政生</span>
    </div>
    <div class="header-meta">
      <span class="meta-chip">96 个志愿</span>
      <span class="meta-chip">含院校代码</span>
      <span class="meta-chip">基于2025投档</span>
    </div>
  </header>

  <!-- Hero Score Card -->
  <section class="hero">
    <div class="score-card">
      <div class="score-row">
        <div class="score-main">
          <span class="score-num">450</span>
          <span class="score-label">分</span>
        </div>
        <div class="score-info">
          <div class="rank">预估位次</div>
          <div class="rank-val">≈ 136,600</div>
        </div>
      </div>

      <div class="prob-overview">
        <span class="label">录取概率分布</span>
        <div class="bar"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
        <span class="num" id="barNum">0/96</span>
      </div>

      <div class="tier-stats">
        <div class="tier-stat">
          <div class="dot" style="background:var(--tier-chong);box-shadow:0 0 8px var(--tier-chong)"></div>
          <div class="n" style="color:var(--tier-chong)" id="cntChong">0</div>
          <div class="l">冲刺</div>
        </div>
        <div class="tier-stat">
          <div class="dot" style="background:var(--tier-chongwen);box-shadow:0 0 8px var(--tier-chongwen)"></div>
          <div class="n" style="color:var(--tier-chongwen)" id="cntChongwen">0</div>
          <div class="l">冲稳</div>
        </div>
        <div class="tier-stat">
          <div class="dot" style="background:var(--tier-wen);box-shadow:0 0 8px var(--tier-wen)"></div>
          <div class="n" style="color:var(--tier-wen)" id="cntWen">0</div>
          <div class="l">稳妥</div>
        </div>
        <div class="tier-stat">

// ── Probability ──
function calcProb(rank, g) {
  const r = {'冲':[100000,130000],'冲稳':[130000,155000],'稳':[155000,185000],'保':[185000,210000]};
  const [lo,hi] = r[g]||[100000,210000];
  let raw = 1-(rank-lo)/(hi-lo);
  raw = Math.max(0,Math.min(1,raw));
  let p;
  if(g==='冲') p=0.18+raw*0.28;
  else if(g==='冲稳') p=0.42+raw*0.30;
  else if(g==='稳') p=0.68+raw*0.22;
  else p=0.86+raw*0.12;
  return Math.round(Math.min(p,.98)*100);
}
function probCat(p){return p>=60?'high':p>=40?'medium':'low'}
function probColor(p){return p>=60?'var(--system-green)':p>=40?'var(--system-orange)':'var(--system-red)'}
function probLabel(p){return p>=80?'很高':p>=60?'较高':p>=40?'中等':'偏低'}

// ── State ──
let state = { filter:'all', sd:false, prob:null, search:'' };

function getFiltered() {
  let d = DATA;
  if(state.filter!=='all') d = d.filter(r=>r[7]===state.filter);
  if(state.sd) d = d.filter(r=>r[8]===true);
  if(state.prob) d = d.filter(r=>probCat(calcProb(r[5],r[7]))===state.prob);
  if(state.search){
    const q = state.search.toLowerCase();
    d = d.filter(r=>r[1].toLowerCase().includes(q)||r[3].toLowerCase().includes(q));
  }
  return d;
}

// ── Render ──
function render() {
  const data = getFiltered();
  const sec = document.getElementById('sections');
  const empty = document.getElementById('empty');
  document.getElementById('count').textContent = `${data.length}/96`;

  if(!data.length){
    sec.innerHTML = '';
    empty.classList.add('active');
    document.getElementById('barFill').style.width = '0%';
    document.getElementById('barNum').textContent = '0/96';
    return;
  }
  empty.classList.remove('active');

  document.getElementById('barFill').style.width = `${(data.length/96)*100}%`;
  document.getElementById('barNum').textContent = `${data.length}/96`;

  // Stats
  document.getElementById('cntChong').textContent = DATA.filter(r=>r[7]==='冲').length;
  document.getElementById('cntChongwen').textContent = DATA.filter(r=>r[7]==='冲稳').length;
  document.getElementById('cntWen').textContent = DATA.filter(r=>r[7]==='稳').length;
  document.getElementById('cntBao').textContent = DATA.filter(r=>r[7]==='保').length;

  // Group
  const groups = {'冲':[],'冲稳':[],'稳':[],'保':[]};
  data.forEach(r=>{if(groups[r[7]])groups[r[7]].push(r)});

  const labels = {
    '冲': {t:'冲刺志愿', s:'大胆尝试 · 概率20-45%', c:'var(--tier-chong)'},
    '冲稳': {t:'冲稳结合', s:'最佳匹配段 · 概率40-70%', c:'var(--tier-chongwen)'},
    '稳': {t:'稳妥志愿', s:'录取大概率 · 概率65-90%', c:'var(--tier-wen)'},
    '保': {t:'保底志愿', s:'确保录取 · 概率85-98%', c:'var(--tier-bao)'}
  };

  let html = '';
  for(const [tier, items] of Object.entries(groups)){
    if(!items.length) continue;
    const l = labels[tier];
    html += `
      <div class="section">
        <div class="section-header">
          <div class="section-title"><span class="dot" style="background:${l.c};box-shadow:0 0 8px ${l.c}"></span>${l.t}</div>
          <div class="section-sub">${l.s} · ${items.length}个</div>
        </div>`;
    items.forEach(r=>{
      const [idx,school,sCode,major,mCode,rank,score,gradient,isSd,short,desc] = r;
      const prob = calcProb(rank,gradient);
      const pc = probColor(prob);
      const pl = probLabel(prob);
      const tColor = gradient==='冲'?'var(--tier-chong)':gradient==='冲稳'?'var(--tier-chongwen)':gradient==='稳'?'var(--tier-wen)':'var(--tier-bao)';

      html += `
        <div class="card" onclick="this.classList.toggle('expanded')">
          <div class="card-row">
            <div class="card-idx">${idx}</div>
            <div class="card-tier">
              <div class="dot" style="background:${tColor};color:${tColor}"></div>
              <div class="label" style="color:${tColor}">${gradient}</div>
            </div>
            <div class="card-main">
              <div class="card-school">
                ${isSd?'<span class="sd">山东</span>':''}
                <span>${school}</span>
                <span class="code">${sCode}</span>
              </div>
              <div class="card-major">
                <span class="mcode">${mCode}</span>
                <span class="mname">${major}</span>
              </div>
            </div>
            <div class="card-stats">
              <div class="stat-block">
                <div class="v" style="color:var(--text-secondary)">${rank.toLocaleString()}</div>
                <div class="l">位次</div>
              </div>
              <div class="stat-block">
                <div class="v" style="color:var(--text-primary)">${score}</div>
                <div class="l">估分</div>
              </div>
              <div class="prob-block">
                <div class="pct" style="color:${pc}">${prob}%</div>
                <div class="lbl">${pl}</div>
              </div>
            </div>
          </div>
          <div class="card-detail">
            <div class="detail-inner">
              <div class="detail-item detail-full">
                <span class="dl">推荐理由</span>
                <span class="dv hl">${short}</span>
              </div>
              <div class="detail-item detail-full">
                <span class="dl">深度分析</span>
                <span class="dv">${desc}</span>
              </div>
              <div class="detail-item">
                <span class="dl">院校代码</span>
                <span class="dv mono">${sCode}</span>
              </div>
              <div class="detail-item">
                <span class="dl">专业代码</span>
                <span class="dv mono">${mCode}</span>
              </div>
            </div>
          </div>
        </div>`;
    });
    html += `</div>`;
  }
  sec.innerHTML = html;
}

// ── Events ──
document.querySelectorAll('.chip[data-filter]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const f = btn.dataset.filter;
    if(f==='sd'){state.sd=!state.sd;btn.classList.toggle('active');render();return}
    if(['high','medium','low'].includes(f)){
      state.prob = state.prob===f?null:f;
      document.querySelectorAll('.chip[data-filter]').forEach(b=>{
        if(['high','medium','low'].includes(b.dataset.filter)) b.classList.toggle('active',b.dataset.filter===state.prob);
        if(['all','冲','冲稳','稳','保'].includes(b.dataset.filter)) b.classList.remove('active');
      });
      if(!state.prob) document.querySelector('.chip[data-filter="all"]').classList.add('active');
      state.filter='all';
      render();return;
    }
    state.filter=f;state.prob=null;
    document.querySelectorAll('.chip[data-filter]').forEach(b=>{
      if(b.dataset.filter===f) b.classList.add('active');
      else if(!['sd','high','medium','low'].includes(b.dataset.filter)) b.classList.remove('active');
      if(['high','medium','low'].includes(b.dataset.filter)) b.classList.remove('active');
    });
    render();
  });
});

document.getElementById('search').addEventListener('input', e=>{
  state.search = e.target.value;
  render();
});

render();
</script>
