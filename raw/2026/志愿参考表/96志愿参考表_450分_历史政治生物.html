<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026年山东高考96志愿参考表 · 450分·历史+政治+生物</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #1E40AF;
  --primary-light: #3B82F6;
  --primary-dark: #1E3A8A;
  --accent: #D97706;
  --accent-light: #F59E0B;
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --muted: #E9EEF6;
  --border: #DBEAFE;
  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-muted: #94A3B8;
  --destructive: #DC2626;
  --success: #16A34A;

  --chong: #DC2626;
  --chong-bg: #FEF2F2;
  --chongwen: #D97706;
  --chongwen-bg: #FFF7ED;
  --wen: #16A34A;
  --wen-bg: #F0FDF4;
  --bao: #2563EB;
  --bao-bg: #EFF6FF;

  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.07), 0 2px 4px -2px rgba(0,0,0,.05);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.04);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:'Noto Sans SC','Fira Sans',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text-primary);line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* Header */
.header{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;padding:0;
  position:sticky;top:0;z-index:100;
  box-shadow:var(--shadow-md);
}
.header-inner{
  max-width:1400px;margin:0 auto;padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
}
.header h1{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.header h1 .badge{
  font-size:.7rem;background:rgba(255,255,255,.15);padding:2px 10px;
  border-radius:20px;font-weight:500;letter-spacing:0;
}
.header-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;opacity:.9}
.header-meta span{display:flex;align-items:center;gap:4px}

/* Stats bar */
.stats-bar{
  max-width:1400px;margin:0 auto;padding:16px 24px 0;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;
}
.stat-card{
  background:var(--surface);border-radius:var(--radius);padding:12px 16px;
  box-shadow:var(--shadow);text-align:center;border:1px solid var(--border);
  transition:transform .15s,box-shadow .15s;
}
.stat-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.stat-card .num{font-size:1.3rem;font-weight:700;font-family:'Fira Code',monospace}
.stat-card .label{font-size:.75rem;color:var(--text-muted);margin-top:2px}
.stat-card .num.chong{color:var(--chong)}
.stat-card .num.chongwen{color:var(--chongwen)}
.stat-card .num.wen{color:var(--wen)}
.stat-card .num.bao{color:var(--bao)}
.stat-card .num.total{color:var(--primary)}

/* Filter bar */
.filter-bar{
  max-width:1400px;margin:0 auto;padding:12px 24px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
}
.filter-btn{
  padding:6px 16px;border-radius:20px;border:1.5px solid var(--border);
  background:var(--surface);cursor:pointer;font-size:.82rem;font-weight:500;
  transition:all .15s;font-family:inherit;
}
.filter-btn:hover{border-color:var(--primary-light);color:var(--primary)}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-btn.sd{display:flex;align-items:center;gap:4px}
.filter-btn.sd.active{background:var(--accent);border-color:var(--accent)}
.filter-count{font-size:.82rem;color:var(--text-muted);margin-left:auto}

/* Search */
.search-box{position:relative;margin-left:auto}
.search-box input{
  padding:6px 12px 6px 32px;border-radius:20px;border:1.5px solid var(--border);
  font-size:.82rem;width:200px;font-family:inherit;
  background:var(--surface);outline:none;transition:border-color .15s;
}
.search-box input:focus{border-color:var(--primary-light)}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-muted)}

/* Table container */
.table-wrap{
  max-width:1400px;margin:6px auto 40px;padding:0 24px;
}
.table-container{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  border:1px solid var(--border);overflow:hidden;
}
table{width:100%;border-collapse:collapse;font-size:.85rem}
thead{position:sticky;top:0;z-index:10}
thead th{
  background:var(--primary);color:#fff;padding:12px 10px;
  text-align:left;font-weight:600;font-size:.78rem;text-transform:uppercase;
  letter-spacing:.03em;white-space:nowrap;position:relative;
}
thead th:not(:last-child)::after{
  content:'';position:absolute;right:0;top:6px;bottom:6px;width:1px;
  background:rgba(255,255,255,.15);
}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:var(--primary-dark)}
th.sortable .sort-icon{display:inline-block;margin-left:3px;opacity:.3;font-size:.65rem}
th.sortable.sort-asc .sort-icon,.th.sortable.sort-desc .sort-icon{opacity:1}

tbody tr{
  transition:background .12s;
  border-bottom:1px solid var(--muted);
}
tbody tr:hover{background:var(--muted)}
tbody tr.row-chong{background:var(--chong-bg)}
tbody tr.row-chongwen{background:var(--chongwen-bg)}
tbody tr.row-wen{background:var(--wen-bg)}
tbody tr.row-bao{background:var(--bao-bg)}
tbody tr.row-chong:hover{background:#FEE2E2}
tbody tr.row-chongwen:hover{background:#FFEDD5}
tbody tr.row-wen:hover{background:#DCFCE7}
tbody tr.row-bao:hover{background:#DBEAFE}

tbody td{padding:8px 10px;vertical-align:middle}
td.idx{font-weight:600;text-align:center;font-family:'Fira Code',monospace;font-size:.78rem;width:40px}
td.school{font-weight:600}
td.school .code{font-size:.68rem;color:var(--text-muted);font-weight:400;font-family:'Fira Code',monospace;margin-left:4px}
td.school .sd-tag{
  display:inline-block;font-size:.6rem;background:var(--accent-light);color:#fff;
  padding:0 6px;border-radius:4px;font-weight:600;margin-right:4px;line-height:1.5;
}
td.major{max-width:220px}
td.major .major-code{
  display:inline-block;font-size:.68rem;font-family:'Fira Code',monospace;
  background:var(--muted);padding:0 6px;border-radius:3px;margin-right:4px;
  color:var(--text-secondary);
}
td.rank{font-family:'Fira Code',monospace;font-weight:500;text-align:right;font-size:.78rem}
td.score{font-family:'Fira Code',monospace;font-weight:600;font-size:.85rem;text-align:center}
td.gradient{
  text-align:center;font-weight:600;font-size:.72rem;
  border-radius:4px;white-space:nowrap;
}
.tag{
  display:inline-block;padding:2px 10px;border-radius:12px;
  font-size:.72rem;font-weight:600;
}
.tag-chong{background:var(--chong);color:#fff}
.tag-chongwen{background:var(--chongwen);color:#fff}
.tag-wen{background:var(--wen);color:#fff}
.tag-bao{background:var(--bao);color:#fff}

/* Rank bar */
.rank-bar-cell{width:120px;padding:8px 10px}
.rank-bar-track{
  height:6px;background:var(--muted);border-radius:3px;overflow:hidden;position:relative;
  min-width:60px;
}
.rank-bar-fill{
  height:100%;border-radius:3px;transition:width .3s ease;
}
.rank-bar-fill.chong{background:var(--chong)}
.rank-bar-fill.chongwen{background:var(--chongwen)}
.rank-bar-fill.wen{background:var(--wen)}
.rank-bar-fill.bao{background:var(--bao)}

/* Recommendation reason */
.reason-toggle{
  cursor:pointer;color:var(--primary-light);font-size:.72rem;
  text-decoration:underline dotted;user-select:none;background:none;border:none;font-family:inherit;
}
.reason-popup{
  display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
  background:var(--text-primary);color:#fff;padding:8px 12px;border-radius:6px;
  font-size:.78rem;width:280px;z-index:20;text-align:left;font-weight:400;line-height:1.5;
  box-shadow:var(--shadow-lg);
}
.reason-popup::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--text-primary)}
td.reason-cell{position:relative;text-align:center}
tr:hover .reason-popup{display:block}

/* Legend */
.legend{
  max-width:1400px;margin:0 auto;padding:16px 24px 32px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--text-secondary)}
.legend-dot{width:10px;height:10px;border-radius:50%}

/* Responsive */
@media(max-width:1024px){
  .rank-bar-cell{display:none}
  td.major{max-width:160px}
}
@media(max-width:768px){
  .header-inner{padding:12px 16px}
  .header h1{font-size:1.05rem}
  .header-meta{font-size:.72rem;gap:8px}
  .stats-bar{padding:12px 16px 0;grid-template-columns:repeat(3,1fr)}
  .filter-bar{padding:10px 16px}
  .search-box input{width:140px}
  .table-wrap{padding:0 12px}
  table{font-size:.78rem}
  thead th{padding:8px 6px;font-size:.7rem}
  tbody td{padding:6px 6px}
  td.idx{width:28px;font-size:.7rem}
  td.major{max-width:100px}
  td.school .code{display:none}
  td.score{font-size:.78rem}
  .legend{padding:12px 16px 24px}
}
@media(max-width:480px){
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .header-meta{width:100%}
  td.major{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.reason-cell{display:none}
}
</style>
</head>

// ── State ──
let currentFilter = 'all';
let sdOnly = false;
let currentSort = { key: null, dir: 'asc' };
let searchTerm = '';

function getFilteredData() {
  let d = DATA;
  if (currentFilter !== 'all') d = d.filter(r => r[7] === currentFilter);
  if (sdOnly) d = d.filter(r => r[8] === true);
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    d = d.filter(r => r[1].toLowerCase().includes(q) || r[3].toLowerCase().includes(q));
  }
  return d;
}

function sortData(data) {
  if (!currentSort.key) return data;
  const d = [...data];
  d.sort((a, b) => {
    const aidx = a[0], bIdx = b[0];
    let va, vb;
    if (currentSort.key === 'rank') { va = a[5]; vb = b[5]; }
    else { va = aidx; vb = bIdx; }
    const cmp = va - vb;
    return currentSort.dir === 'asc' ? cmp : -cmp;
  });
  return d;
}

function formatRank(n) {
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

const rankMin = 90000, rankMax = 210000;

function rankPercent(rank) {
  return Math.max(0, Math.min(100, ((rank - rankMin) / (rankMax - rankMin)) * 100));
}

function reasonText(idx, major, reason) {
  return `${idx}. ${major} — ${reason}`;
}

function render() {
  let data = getFilteredData();
  data = sortData(data);
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  document.getElementById('filterCount').textContent = `显示 ${data.length} / 96 个志愿`;

  // Stats
  const all = getFilteredData();
  document.getElementById('statTotal').textContent = DATA.length;
  document.getElementById('statChong').textContent = DATA.filter(r => r[7]==='冲').length;
  document.getElementById('statChongwen').textContent = DATA.filter(r => r[7]==='冲稳').length;
  document.getElementById('statWen').textContent = DATA.filter(r => r[7]==='稳').length;
  document.getElementById('statBao').textContent = DATA.filter(r => r[7]==='保').length;
  document.getElementById('statSd').textContent = DATA.filter(r => r[8]===true).length;

  data.forEach(r => {
    const [idx, school, sCode, major, mCode, rank, score, gradient, isSd, reason] = r;
    const tr = document.createElement('tr');
    tr.className = `row-${gradient}`;

    const gradClass = `tag-${gradient}`;

    tr.innerHTML = `
      <td class="idx">${idx}</td>
      <td class="gradient"><span class="tag ${gradClass}">${gradient}</span></td>
      <td class="school">
        ${isSd ? '<span class="sd-tag">山东</span>' : ''}
        ${school}
        <span class="code">${sCode}</span>
      </td>
      <td class="major">
        <span class="major-code">${mCode}</span>
        ${major}
      </td>
      <td class="rank">${formatRank(rank)}</td>
      <td class="score">${score}</td>
      <td class="rank-bar-cell">
        <div class="rank-bar-track">
          <div class="rank-bar-fill ${gradient}" style="width:${rankPercent(rank)}%"></div>
        </div>
      </td>
      <td class="reason-cell">
        <button class="reason-toggle" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block'">💡 理由</button>
        <div class="reason-popup">${reason}</div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// ── Event handlers ──
document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter;
    if (f === 'sd') {
      sdOnly = !sdOnly;
      btn.classList.toggle('active');
      if (currentFilter !== 'all') {
        document.querySelectorAll('.filter-btn[data-filter]').forEach(b => {
          if (b.dataset.filter !== 'sd') b.classList.remove('active');
        });
        currentFilter = 'all';
      }
      render();
      return;
    }
    currentFilter = f;
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => {
      if (b.dataset.filter !== 'sd') b.classList.toggle('active', b === btn);
    });
    render();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value;
  render();
});

document.querySelectorAll('th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (currentSort.key === key) {
      currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      currentSort.key = key;
      currentSort.dir = 'asc';
    }
    document.querySelectorAll('th.sortable .sort-icon').forEach(s => {
      s.textContent = '▼';
      s.style.opacity = '.3';
    });
    const icon = th.querySelector('.sort-icon');
    icon.textContent = currentSort.dir === 'asc' ? '▲' : '▼';
    icon.style.opacity = '1';
    th.classList.toggle('sort-asc', currentSort.dir === 'asc');
    th.classList.toggle('sort-desc', currentSort.dir === 'desc');
    render();
  });
});

// Close popups on click elsewhere
document.addEventListener('click', e => {
  if (!e.target.classList.contains('reason-toggle')) {
    document.querySelectorAll('.reason-popup').forEach(p => p.style.display = 'none');
  }
});

render();
</script>
